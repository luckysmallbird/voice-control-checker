<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語音控制機種資料比對工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #466385; margin-bottom: 20px;">
            <h1 style="border-bottom: none; margin-bottom: 0;">語音控制機種資料比對工具</h1>
            <div id="topActionButtons">
                <button id="exportReportBtn" style="background-color: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; margin-right: 10px; width: auto;">匯出成報告</button>
                <a href="/editor.html" style="background-color: #466385; color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 14px;">前往設定檔編輯器</a>
            </div>
        </div>
        
        <div class="top-layout">
            <div class="section device-section">
                <h2>1. 機種設定</h2>
                <div class="form-group">
                    <label for="modelId">機種名稱 (Model ID)</label>
                    <input type="text" id="modelId" placeholder="例如: QXK">
                </div>
                <div class="form-group">
                    <label for="deviceType">家電類型 (Device Type)</label>
                    <select id="deviceType"></select>
                </div>
            </div>

            <div class="section source-section">
                <h2>2. 資料庫資料</h2>
                <div class="form-group">
                    <label for="folderPath">CSV 資料夾路徑</label>
                    <input type="text" id="folderPath" placeholder="輸入絕對或相對路徑">
                </div>
                <div class="form-group">
                    <label for="historySelect">歷史比對紀錄</label>
                    <select id="historySelect">
                        <option value="">-- 選擇歷史紀錄以自動還原 --</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>3. 功能勾選</h2>
            <div id="featuresContainer"></div>
        </div>

        <button id="checkBtn">開始比對</button>

        <div class="section" id="reportSection" style="display: none; margin-top: 20px;">
            <h2>比對報告</h2>
            <table id="reportTable">
                <thead>
                    <tr>
                        <th>功能項目</th>
                        <th>資料表 (Table)</th>
                        <th>檢查目的</th>
                        <th>比對狀態</th>
                    </tr>
                </thead>
                <tbody id="reportBody"></tbody>
            </table>
            
            <div id="sqlBlock" style="display: none; margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 20px;">
                <button id="generateSqlBtn" style="width: auto; padding: 6px 12px; margin-bottom: 10px;">產生缺漏資料 SQL</button>
                <textarea id="sqlOutput" style="width: 100%; height: 250px; font-family: monospace; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; display: none;" readonly></textarea>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="export.js"></script>
</body>
</html>
